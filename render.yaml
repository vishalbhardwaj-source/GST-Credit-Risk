services:
  - type: web
    name: gst-credit-risk-api
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: KEEP_ALIVE
        value: "true"
      - key: KEEP_ALIVE_URL
        value: https://gst-credit-risk-api.onrender.com
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: "10"
