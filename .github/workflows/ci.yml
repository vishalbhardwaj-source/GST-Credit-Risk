name: CI — Test Suite

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  frontend-tests:
    name: Frontend Vitest Suite & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: vite-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: vite-app
        run: npm ci

      - name: Run Vitest unit tests (28 tests)
        working-directory: vite-app
        run: npx vitest run --reporter=verbose

      - name: Verify TypeScript & Vite production build
        working-directory: vite-app
        run: npm run build

  python-backend:
    name: Python Backend Test Suite (Pytest) & Import Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx
          pip install -r requirements.txt

      - name: Run Pytest test suite
        run: python -m pytest tests/ -v

      - name: Check backend imports are valid
        run: python -c "import backend.matcher; import backend.ml_engine; import backend.train_forecaster; import backend.main; print('All backend imports OK')"
